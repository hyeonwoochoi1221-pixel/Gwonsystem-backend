# No production fallbacks in the dev profile. Validated before any beans/connections.
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.generate-ddl=false
spring.flyway.enabled=false
spring.liquibase.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.data-source-properties.sslmode=verify-full
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
supabase.storage.url=${SUPABASE_URL:}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:}
supabase.storage.secret-key=${SUPABASE_SECRET_KEY:}
app.email.logo-url=${EMAIL_LOGO_URL:}
app.frontend.url=${FRONTEND_URL:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Generic production integration variables are never used in dev.
app.mail.enabled=${DEV_MAIL_ENABLED:false}
app.mail.allowed-recipients=${DEV_MAIL_ALLOWED_RECIPIENTS:}
spring.mail.host=${DEV_MAIL_HOST:127.0.0.1}
spring.mail.port=${DEV_MAIL_PORT:587}
spring.mail.username=${DEV_MAIL_USERNAME:}
spring.mail.password=${DEV_MAIL_PASSWORD:}
app.oauth.enabled=${DEV_OAUTH_ENABLED:false}
spring.security.oauth2.client.registration.google.client-id=${DEV_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${DEV_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.naver.client-id=${DEV_NAVER_CLIENT_ID:}
spring.security.oauth2.client.registration.naver.client-secret=${DEV_NAVER_CLIENT_SECRET:}
app.places.enabled=${DEV_PLACES_ENABLED:false}
google.places.api-key=${DEV_GOOGLE_PLACES_API_KEY:}
